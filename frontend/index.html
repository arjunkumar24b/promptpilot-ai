<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="ABC123XYZ..." />
    <title>PromptPilot AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🚀 PromptPilot AI</h1>
        <p class="subtitle">
            Transform vague ideas into powerful AI prompts.
        </p>

        <div class="card">

            <label for="userInput">Describe what you want:</label>

            <textarea
                id="userInput"
                rows="6"
                placeholder="Example: I want to learn DSA for placements..."
            ></textarea>

            <label for="platform">Choose AI Platform:</label>

            <select id="platform">
                <option value="chatgpt">ChatGPT</option>
                <option value="gemini">Gemini</option>
                <option value="claude">Claude</option>
            </select>

            <label for="style">Prompt Style:</label>

            <select id="style">
                <option value="beginner">Beginner</option>
                <option value="professional">Professional</option>
                <option value="technical">Technical</option>
            </select>

            <button onclick="generatePrompt()">
                Generate Prompt
            </button>

        </div>

        <div class="result-card">
            <h2>Generated Output</h2>
            <div id="result">
                Your optimized prompt will appear here...
            </div>
        </div>

        <footer>
            <p>
                Built with ❤️ using FastAPI, Gemini AI, Docker & Render
            </p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
